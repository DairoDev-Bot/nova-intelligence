name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        run: gradle assembleRelease --stacktrace

      - name: Nombrar el APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NovaIntelligence.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: NovaIntelligence-apk
          path: dist/NovaIntelligence.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-build${{ github.run_number }}" dist/NovaIntelligence.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NOVA Intelligence v0.1.0 (build ${{ github.run_number }})" \
            --notes "APK listo para instalar. Compatible con Android 7 a 16."
